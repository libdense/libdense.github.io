:root {
  --ink: #1c1a16;
  --paper: #e9e2d2;
  --faint: #9e9685;
  --glow: #e1dac9;
  --chord: #78746b;
  --moss: #2f4f45;
  --rust: #a34a3f;
  --font: "Dense Plate Serif", "Liberation Serif", "Tinos", "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
#app {
  position: relative; width: 100%; height: 100%; min-height: 360px;
  font-family: var(--font); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
#board {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; touch-action: none; cursor: grab; outline: none;
}
#board.dragging { cursor: grabbing; }
#board.pointing { cursor: pointer; }
.ui { position: absolute; z-index: 2; }
.plate {
  background: var(--paper);
  border: 4px double var(--ink);
  box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--ink);
}
#bar {
  top: 10px; left: 10px; right: 10px;
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 10px;
  padding: 6px 10px 7px;
}
.brand {
  font-weight: bold; font-size: 13px; letter-spacing: 1.5px;
  align-self: center; white-space: nowrap; padding-right: 4px;
}
.brand i { font-weight: normal; letter-spacing: 0; }
.fld { display: flex; flex-direction: column; gap: 1px; }
.fld > span {
  font-size: 10px; font-weight: bold; letter-spacing: 1.4px; color: var(--chord);
}
select, button {
  font-family: var(--font); font-size: 13px; color: var(--ink);
  background: var(--glow); border: 1px solid var(--ink); border-radius: 0;
  padding: 3px 6px; height: 26px; cursor: pointer;
}
select:focus-visible, button:focus-visible, #board:focus-visible {
  outline: 2px solid var(--moss); outline-offset: 1px;
}
button { letter-spacing: 1px; font-size: 12px; }
button:hover, select:hover { background: #d8d0bd; }
button.on { background: var(--ink); color: var(--paper); }
button:disabled { opacity: 0.45; cursor: default; }
.sep { width: 1px; align-self: stretch; background: var(--faint); margin: 0 2px; }
.grow { flex: 1 1 auto; }
#status {
  align-self: center; font-style: italic; font-size: 12px; color: var(--chord);
  white-space: nowrap;
}
.btn-link {
  display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 3px 8px;
  font-size: 12px; letter-spacing: 1px; color: var(--ink); text-decoration: none;
  background: var(--glow); border: 1px solid var(--ink); align-self: center;
}
.btn-link:hover { background: #d8d0bd; }
.btn-link:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }
#btn-png, #btn-md, .btn-link, #btn-settings, #btn-play, #btn-step, #btn-reset { align-self: center; }
#drawer {
  left: 10px; width: 300px; overflow: auto; padding: 8px 12px 12px; font-size: 13px;
}
#drawer[hidden] { display: none; }
#drawer section { margin-bottom: 10px; }
#drawer h4 {
  margin: 4px 0 6px; font-size: 11px; letter-spacing: 1.6px; border-bottom: 1px solid var(--ink); padding-bottom: 3px;
}
#drawer h4 i { font-weight: normal; letter-spacing: 0; color: var(--rust); }
#drawer .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
#drawer .row > span { font-style: italic; color: var(--chord); white-space: nowrap; }
#drawer .row select { width: 160px; height: 24px; font-size: 12px; padding: 1px 4px; }
#drawer .chk { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; }
#drawer .chk input { margin: 0; accent-color: var(--moss); }
#drawer .opt { display: grid; grid-template-columns: 18px 1fr auto; align-items: start; gap: 2px 6px; margin: 4px 0; }
#drawer .opt .tag { font-size: 10px; letter-spacing: 0.8px; color: var(--chord); white-space: nowrap; }
#drawer .opt .tag.lossy { color: var(--rust); }
#drawer .opt .eff { grid-column: 2 / 4; font-size: 11px; font-style: italic; color: var(--chord); line-height: 1.25; }
#drawer .opt.dim { opacity: 0.55; }
#drawer .ring-grid { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 3px 6px; align-items: center; margin-top: 4px; }
#drawer .ring-grid > span { font-style: italic; color: var(--chord); font-size: 12px; }
#drawer .ring-grid select { height: 22px; font-size: 12px; padding: 0 3px; }

#drawer .hint-line { font-size: 11px; font-style: italic; color: var(--chord); margin-top: 4px; }
#drawer .row-btns { display: flex; gap: 6px; }
#drawer.disabled-net #sec-net { opacity: 0.5; }
#preset-note { font-size: 11px; font-style: italic; color: var(--chord); }
#views {
  left: 10px; bottom: 10px; padding: 5px 8px;
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center; max-width: calc(100% - 20px);
}
#views .lbl {
  font-size: 10px; font-weight: bold; letter-spacing: 1.4px; color: var(--chord); margin: 0 2px 0 4px;
}
#views button { height: 24px; padding: 2px 6px; font-size: 11px; }
#inspector {
  right: 10px; width: 350px; max-width: calc(100% - 20px);
  overflow: auto; padding: 12px 14px 14px; font-size: 14px; line-height: 1.35;
}
#inspector[hidden] { display: none; }
#inspector .top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-size: 11px; font-weight: bold; letter-spacing: 1.4px;
}
#inspector .top button { height: 22px; font-size: 11px; padding: 1px 6px; }
#inspector h2 {
  font-weight: normal; font-size: 24px; letter-spacing: 3px; margin: 6px 0 2px;
  border-bottom: 1px solid var(--ink); padding-bottom: 4px;
}
#inspector .phase { font-style: italic; color: var(--chord); font-size: 13px; margin-bottom: 8px; }
#inspector h3 {
  font-size: 11px; letter-spacing: 1.6px; margin: 12px 0 4px; color: var(--ink);
  border-bottom: 1px solid var(--faint); padding-bottom: 2px;
}
#inspector p { margin: 4px 0; }
#inspector code {
  font-family: "Liberation Mono", "Cousine", Menlo, Consolas, monospace; font-size: 12px;
  background: var(--glow); padding: 0 3px;
}
#inspector ul { margin: 2px 0; padding-left: 18px; }
#inspector table { width: 100%; border-collapse: collapse; font-size: 13px; }
#inspector td { padding: 2px 0; border-bottom: 1px solid var(--glow); }
#inspector td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#inspector td:first-child { font-style: italic; color: var(--chord); }
#inspector .note { font-style: italic; font-size: 12px; color: var(--chord); }
#inspector .chips span {
  display: inline-block; border: 1px solid var(--ink); padding: 0 5px; margin: 2px 4px 2px 0;
  font-size: 11px; letter-spacing: 1px;
}
#inspector .chips span.off { border-style: dashed; color: var(--faint); border-color: var(--faint); }
#hint {
  font-style: italic; font-size: 12px; color: var(--chord); margin-left: 6px;
  transition: opacity 0.6s;
}
#hint.flash { color: var(--rust); }
#hint.gone { opacity: 0; }
#app.compact #bar { gap: 6px 8px; }
#app.compact #bar .fld > span { display: none; }
#app.compact #status { display: none; }
@media (max-width: 1250px) { #status { display: none; } }
.btn-dl { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 1340px) { .btn-link span { display: none; } }
#app.compact #hint { display: none; }
#app.compact #views .grp-layers { display: none; }
#views .grp-layers { display: inline-flex; gap: 4px; align-items: center; }
#app.compact #inspector { width: auto; left: 10px; }
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
@media (max-width: 600px) {
  #bar, #views { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  #bar > *, #views > * { flex: 0 0 auto; }
  #bar .grow { display: none; }
}

/* ==========================================================================
   3. FORMATTING AND REFERENCE INTERPOLATION
   ========================================================================== */

function fmtInt(v) {
  if (!isFinite(v)) return "-";
  const neg = v < 0;
  const s = String(Math.round(Math.abs(v)));
  let out = "";
  for (let i = 0; i < s.length; i++) {
    if (i && (s.length - i) % 3 === 0) out += ",";
    out += s[i];
  }
  return (neg ? "-" : "") + out;
}
function fmtMs(v) {
  if (!isFinite(v)) return "-";
  if (v >= 100) return fmtInt(v);
  if (v >= 10) return v.toFixed(1);
  if (v >= 1) return v.toFixed(2);
  return v.toFixed(3);
}
function fmtBytes(b) {
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (b >= 1000 && i < units.length - 1) { b /= 1000; i++; }
  if (i === 0) return fmtInt(b) + " B";
  return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + " " + units[i];
}
function fmtGbps(g) {
  if (g >= 100) return fmtInt(g);
  if (g >= 10) return g.toFixed(1);
  if (g >= 1) return g.toFixed(2);
  return g.toFixed(3);
}
function hex32(v) { return "0x" + ((v >>> 0).toString(16).toUpperCase().padStart(8, "0")); }
function fmtPct(f) { return !isFinite(f) ? "-" : (f * 100 >= 100 ? fmtInt(f * 100) : (f * 100).toFixed(1)) + "%"; }
function fmtHz(hz) { return (Math.abs(hz - Math.round(hz)) < 1e-6 ? String(Math.round(hz)) : hz.toFixed(2)) + " Hz"; }
function fmtLink(g) { return (g >= 1 ? String(g) : g.toFixed(1)) + " Gbit/s"; }
function fmtTB(tb) {
  if (tb >= 1000) return (tb / 1000).toFixed(tb >= 10000 ? 0 : 1) + " PB";
  if (tb >= 1) return (tb >= 100 ? fmtInt(tb) : tb.toFixed(1)) + " TB";
  return fmtInt(tb * 1000) + " GB";
}
function fmtRate(bitsPerSec) {
  if (bitsPerSec >= 1e9) return (bitsPerSec / 1e9).toFixed(2) + " Gbit/s";
  if (bitsPerSec >= 1e6) return (bitsPerSec / 1e6).toFixed(bitsPerSec >= 1e8 ? 0 : 1) + " Mbit/s";
  return (bitsPerSec / 1e3).toFixed(1) + " kbit/s";
}
function profileLabel(id) {
  for (const p of WIRE_PROFILES) if (p.id === id) return p.label;
  return id;
}
function cpuProfile(id) {
  for (const c of CPU_PROFILES) if (c.id === id) return c;
  return CPU_PROFILES[0];
}
function tickRate(id) {
  for (const t of TICK_RATES) if (t.id === id) return t;
  return TICK_RATES[5];
}
function optDef(id) {
  for (const o of OPTS) if (o.id === id) return o;
  return null;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* Piecewise linear in log(x); clamped at both ends. */
function interpLog(xs, ys, x) {
  const n = xs.length;
  if (!(x > xs[0])) return ys[0];
  if (x >= xs[n - 1]) return ys[n - 1];
  for (let i = 0; i < n - 1; i++) {
    if (x <= xs[i + 1]) {
      const t = (Math.log(x) - Math.log(xs[i])) / (Math.log(xs[i + 1]) - Math.log(xs[i]));
      return ys[i] + t * (ys[i + 1] - ys[i]);
    }
  }
  return ys[n - 1];
}

/* Per-unit costs derived once from the measured tables. */
const REF = (function () {
  const n = PLATE_REF.players;
  const del = n.map((v) => v * v);
  const out = { del: del, players: n, simNsPerEntity: {}, nsPerDel: {}, bytesPerDel: {}, sdkPerSession: {} };
  for (const t of ["ryzen", "epyc"]) {
    out.simNsPerEntity[t] = n.map((v, i) => PLATE_REF[t].sim_ms[i] * 1e6 / v);
    out.nsPerDel[t] = {};
    for (const k in PLATE_REF[t].sender_ms) out.nsPerDel[t][k] = n.map((v, i) => PLATE_REF[t].sender_ms[k][i] * 1e6 / del[i]);
  }
  for (const k in PLATE_REF.gbps_20hz) {
    out.bytesPerDel[k] = n.map((v, i) => PLATE_REF.gbps_20hz[k][i] * 1e9 / 8 / 20 / del[i]);
    out.sdkPerSession[k] = n.map((v, i) => PLATE_REF.sdk_mb[k][i] * 1e6 / v);
  }
  return out;
})();

function workerFactor(kind, w, players) {
  const row = WORKER_SCALING[kind][w] || WORKER_SCALING[kind][1];
  return interpLog(WORKER_SCALING.players, row, Math.max(1, players));
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ==========================================================================
   4. VIEWER MODEL
   An in-browser model of the libdense_sim visibility predicate and the
   authority loop. Counts (dirty, crossings, groups, refs, ENTER, LEAVE,
   UPDATE, deliveries) are exact for this model. Times and bytes are
   interpolated from the v0.4.5 plates and are estimates.
   ========================================================================== */

function DenseModel(opts) {
  const cfg = CONFIGS[opts.config];
  const sc = SCENARIOS[opts.scenario];
  const N = opts.players;
  const K = cfg.npcs ? Math.round(N * (opts.npc || 0)) : 0;
  const E = N + K;
  const C = CHUNK_SIZE;
  const W = sc.w, H = sc.h;
  const GX = Math.ceil(W / C), GY = Math.ceil(H / C), G = GX * GY;
  const S = GX + 1, DG = S * (GY + 1);
  const CGX = Math.ceil(W / CELL_SIZE), CGY = Math.ceil(H / CELL_SIZE);

  this.opts = opts; this.cfg = cfg; this.sc = sc;
  this.N = N; this.K = K; this.E = E; this.R = opts.radius;
  this.W = W; this.H = H; this.GX = GX; this.GY = GY; this.G = G; this.S = S;
  this.CGX = CGX;
  this.rng = mulberry32(DEMO.seed ^ (N * 2654435761) ^ (opts.scenario.length * 97));

  this.x = new Int32Array(E); this.y = new Int32Array(E);
  this.px = new Int32Array(E); this.py = new Int32Array(E);
  this.jx = new Float32Array(E); this.jy = new Float32Array(E);
  this.hx = new Float32Array(E); this.hy = new Float32Array(E);
  this.ch = new Int32Array(E); this.pch = new Int32Array(E);
  this.ce = new Int32Array(E);
  this.dirty = new Uint8Array(E); this.crossed = new Uint8Array(E);
  this.tx = new Float32Array(E); this.ty = new Float32Array(E);
  this.route = new Uint8Array(E);
  this.navQueue = new Int32Array(Math.max(1, K)); this.navHead = 0; this.navLen = 0;
  this.aiCursor = 0; this.inputCursor = 0;

  this.ox0 = new Int32Array(N); this.oy0 = new Int32Array(N);
  this.ox1 = new Int32Array(N); this.oy1 = new Int32Array(N);
  this.pox0 = new Int32Array(N); this.poy0 = new Int32Array(N);
  this.pox1 = new Int32Array(N); this.poy1 = new Int32Array(N);
  this.changed = new Int32Array(N);

  this.Ecur = new Int32Array(G); this.Edirty = new Int32Array(G);
  this.Rcur = new Int32Array(G);
  this.diffR = new Int32Array(DG);
  this.diffD = []; this.Dg = [];
  for (let d = 0; d < 9; d++) { this.diffD.push(new Int32Array(DG)); this.Dg.push(new Int32Array(G)); }
  this.cls = new Int32Array(G * 9); this.clsD = new Int32Array(G * 9);
  this.cellStamp = new Uint32Array(CGX * CGY);

  this.hasPrev = false;
  this.visiblePrev = 0;
  this.tick = 0;
  this.ovl = { state: 0, enterStreak: 0, recoverStreak: 0, transitions: 0 };
  this.ledger = {};
  this.ledgerKeys = ["tickMs", "simMs", "senderMs", "deliveries", "enter", "leave", "chunkCross", "bytes"];
  this.ringDirty = [0, 0, 0];
  for (const k of this.ledgerKeys) this.ledger[k] = [];
  this.factor = { img: null, rows: 0, cols: 0, tick: -1 };
  this.m = null;

  this.initPositions();
  this.selected = this.nearestPlayer(sc.view.cx, sc.view.cy);
}

DenseModel.prototype.gauss = function () {
  const u = Math.max(1e-9, this.rng()), v = this.rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};

DenseModel.prototype.place = function (i, isNpc) {
  const r = this.rng, W = this.W, H = this.H;
  let x = 0, y = 0;
  const mv = this.sc.move;
  if (mv === "walk") {
    x = Math.floor(r() * W); y = Math.floor(r() * H);
  } else if (mv === "home") {
    const q = r();
    if (q < 0.55) { x = 192 + this.gauss() * 15; y = 192 + this.gauss() * 15; }
    else if (q < 0.85) {
      const k = Math.floor(r() * 4);
      const cx = (k & 1) ? 288 : 96, cy = (k & 2) ? 288 : 96;
      x = cx + this.gauss() * 22; y = cy + this.gauss() * 22;
    } else {
      const t = r() * W;
      if (r() < 0.5) { x = t; y = 192 + this.gauss() * 4; } else { x = 192 + this.gauss() * 4; y = t; }
    }
  } else {
    /* orbit: herd centered on angle 0 around (256, 256) */
    const rr = clamp(150 + this.gauss() * 16, 96, 210);
    const th = (r() < 0.9 ? this.gauss() * 0.32 : r() * Math.PI * 2);
    x = 256 + rr * Math.cos(th); y = 256 + rr * Math.sin(th);
    this.hx[i] = rr; this.hy[i] = 0;
  }
  x = clamp(Math.floor(x), 0, W - 1); y = clamp(Math.floor(y), 0, H - 1);
  this.x[i] = x; this.y[i] = y; this.px[i] = x; this.py[i] = y;
  if (mv === "home") { this.hx[i] = x; this.hy[i] = y; }
  this.jx[i] = (r() - 0.5) * 0.9; this.jy[i] = (r() - 0.5) * 0.9;
  this.route[i] = 0;
};

DenseModel.prototype.initPositions = function () {
  for (let i = 0; i < this.E; i++) this.place(i, i >= this.N);
  for (let i = 0; i < this.E; i++) {
    this.ch[i] = this.chunkOf(this.x[i], this.y[i]);
    this.pch[i] = this.ch[i];
    this.ce[i] = Math.floor(this.y[i] / CELL_SIZE) * this.CGX + Math.floor(this.x[i] / CELL_SIZE);
  }
};

DenseModel.prototype.chunkOf = function (x, y) {
  return (y >> CHUNK_SHIFT) * this.GX + (x >> CHUNK_SHIFT);
};

DenseModel.prototype.nearestPlayer = function (wx, wy) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < this.N; i++) {
    const dx = this.x[i] + 0.5 - wx, dy = this.y[i] + 0.5 - wy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
};

/* Propose one player step for the scenario's movement rule. */
DenseModel.prototype.proposePlayer = function (i, out) {
  const r = this.rng;
  let dx = Math.floor(r() * 3) - 1, dy = Math.floor(r() * 3) - 1;
  const mv = this.sc.move;
  if (mv === "home") {
    if (r() < 0.22) { dx = Math.sign(this.hx[i] - this.x[i]); dy = Math.sign(this.hy[i] - this.y[i]); }
  } else if (mv === "orbit") {
    const rr = this.hx[i];
    const ax = this.x[i] - 256, ay = this.y[i] - 256;
    const th = Math.atan2(ay, ax) + 1.7 / rr;
    const tx = 256 + rr * Math.cos(th), ty = 256 + rr * Math.sin(th);
    dx = clamp(Math.round(tx - this.x[i]), -2, 2);
    dy = clamp(Math.round(ty - this.y[i]), -2, 2);
    if (r() < 0.15) { dx = clamp(dx + Math.floor(r() * 3) - 1, -2, 2); dy = clamp(dy + Math.floor(r() * 3) - 1, -2, 2); }
  }
  out[0] = dx; out[1] = dy;
};

DenseModel.prototype.tryMove = function (i, dx, dy, m) {
  if (dx === 0 && dy === 0) return false;
  m.proposals++;
  let nx = this.x[i] + dx, ny = this.y[i] + dy;
  if (nx < 0 || ny < 0 || nx >= this.W || ny >= this.H) {
    if (m.collisionOn) { m.rejected++; return false; }
    /* collision checks off: the application accepts the proposal; the
       viewer only keeps positions inside its world. */
    nx = clamp(nx, 0, this.W - 1); ny = clamp(ny, 0, this.H - 1);
    if (nx === this.x[i] && ny === this.y[i]) return false;
  }
  this.x[i] = nx; this.y[i] = ny;
  m.validated++;
  return true;
};

/* Inclusive rectangle add on a (GX+1) x (GY+1) difference grid. */
DenseModel.prototype.addRect = function (d, ax, ay, bx, by, w) {
  const S = this.S;
  d[ay * S + ax] += w; d[ay * S + bx + 1] -= w;
  d[(by + 1) * S + ax] -= w; d[(by + 1) * S + bx + 1] += w;
};

DenseModel.prototype.integrate = function (d, out) {
  const GX = this.GX, GY = this.GY, S = this.S;
  for (let y = 0; y < GY; y++) {
    let run = 0;
    for (let x = 0; x < GX; x++) {
      run += d[y * S + x];
      out[y * GX + x] = run + (y ? out[(y - 1) * GX + x] : 0);
    }
  }
};

/* One full tick, in dsc_server_pipeline order. */
DenseModel.prototype.step = function (st) {
  const N = this.N, K = this.K, E = this.E, r = this.rng, cfg = this.cfg;
  const lad = LADDER[cfg.sched ? this.ovl.state : 0];
  const shed = cfg.sheds;
  const m = {
    tick: this.tick + 1, players: N, npcs: K, entities: E,
    datagrams: cfg.net ? N : 0, accepted: 0, shed: 0, proposals: 0, validated: 0, rejected: 0,
    npcMoved: 0, navPlanned: 0, navQueued: 0, navBudget: 0,
    aiCompleted: 0, aiDeferred: 0, aiBudget: 0, intents: 0,
    cellCross: 0, chunkCross: 0, dirty: 0, combatMarks: 0, nonMoveDirty: 0, occCells: 0,
    subscriptions: 0, obsTrans: 0, groups: 0, refs: 0, visible: 0, inter: 0,
    enter: 0, leave: 0, update: 0, deliveries: 0, classes: 0,
    simMs: 0, tickMs: 0, periodMs: 1000 / st.hzv, pressure: 0, state: this.ovl.state,
    perClientBytes: 0, checksum: 0, busiest: "-", limits: lad,
    collisionOn: !!(st.collision && cfg.collision)
  };

  const X = this.x, Y = this.y, DIRTY = this.dirty;
  this.px.set(X); this.py.set(Y); DIRTY.fill(0); this.crossed.fill(0);

  /* INPUT: one control per player; MMO token buckets follow the ladder. */
  const inputBudget = shed ? Math.ceil(N * lad.input) : N;
  const prop = [0, 0];
  /* VALIDATE: nav drains intents queued by last tick's AI, then collision
     validates players and routed agents in input order. */
  if (K > 0) {
    m.navBudget = Math.max(1, Math.floor(DEMO.nav_routes_per_tick * (shed ? lad.nav : 1)));
    let planned = 0;
    while (this.navLen > 0 && planned < m.navBudget) {
      const a = this.navQueue[this.navHead];
      this.navHead = (this.navHead + 1) % this.navQueue.length; this.navLen--;
      this.route[a] = 2; planned++;
    }
    m.navPlanned = planned; m.navQueued = this.navLen;
  }
  const cur = N > 0 ? this.inputCursor % N : 0;
  for (let i = 0; i < N; i++) {
    let slot = i - cur; if (slot < 0) slot += N;
    if (slot >= inputBudget) { m.shed++; continue; }
    m.accepted++;
    this.proposePlayer(i, prop);
    if (this.tryMove(i, prop[0], prop[1], m)) DIRTY[i] = 1;
  }
  this.inputCursor = (this.inputCursor + inputBudget) % Math.max(1, N);
  for (let i = N; i < E; i++) {
    if (this.route[i] !== 2) continue;
    const dx = r() < 0.85 ? Math.sign(this.tx[i] - this.x[i]) : 0;
    const dy = r() < 0.85 ? Math.sign(this.ty[i] - this.y[i]) : 0;
    if (this.tryMove(i, dx, dy, m)) { this.dirty[i] = 1; m.npcMoved++; }
    if (Math.abs(this.tx[i] - this.x[i]) <= 1 && Math.abs(this.ty[i] - this.y[i]) <= 1) this.route[i] = 0;
  }

  /* SPATIAL: commit, crossings, occupied cells. */
  const stamp = (this.tick + 1) >>> 0;
  {
    const CH = this.ch, PCH = this.pch, CE = this.ce, STAMP = this.cellStamp, CROSSED = this.crossed;
    const GX = this.GX, CGX = this.CGX;
    let cellCross = 0, chunkCross = 0, occCells = 0;
    for (let i = 0; i < E; i++) {
      const x = X[i], y = Y[i];
      const c = (y >> CHUNK_SHIFT) * GX + (x >> CHUNK_SHIFT);
      const ce = (y >> CELL_SHIFT) * CGX + (x >> CELL_SHIFT);
      const c0 = CH[i];
      PCH[i] = c0;
      if (ce !== CE[i]) cellCross++;
      if (c !== c0) { chunkCross++; CROSSED[i] = 1; }
      CH[i] = c; CE[i] = ce;
      if (STAMP[ce] !== stamp) { STAMP[ce] = stamp; occCells++; }
    }
    m.cellCross = cellCross; m.chunkCross = chunkCross; m.occCells = occCells;
  }

  /* COMBAT: demo rule, players only. */
  if (cfg.combat) {
    for (let i = 0; i < N; i++) {
      if (r() < DEMO.combat_hit_rate) {
        m.combatMarks++;
        if (!this.dirty[i]) { this.dirty[i] = 1; m.nonMoveDirty++; }
      }
    }
  }
  { let dsum = 0; for (let i = 0; i < E; i++) dsum += DIRTY[i]; m.dirty = dsum; }

  /* AI: budgeted agents choose targets; intents apply next tick. */
  if (K > 0) {
    m.aiBudget = Math.max(1, Math.floor(DEMO.ai_agents_per_tick * (shed ? lad.ai : 1)));
    const run = Math.min(K, m.aiBudget);
    for (let j = 0; j < run; j++) {
      const i = N + ((this.aiCursor + j) % K);
      if (this.route[i] === 1) continue;
      if (r() < 0.6) {
        const p = Math.floor(r() * N);
        this.tx[i] = clamp(this.x[p] + Math.floor(r() * 17) - 8, 0, this.W - 1);
        this.ty[i] = clamp(this.y[p] + Math.floor(r() * 17) - 8, 0, this.H - 1);
      } else {
        this.tx[i] = clamp(this.x[i] + Math.floor(r() * 97) - 48, 0, this.W - 1);
        this.ty[i] = clamp(this.y[i] + Math.floor(r() * 97) - 48, 0, this.H - 1);
      }
      this.route[i] = 1;
      this.navQueue[(this.navHead + this.navLen) % this.navQueue.length] = i;
      this.navLen++;
      m.intents++;
    }
    this.aiCursor = (this.aiCursor + run) % K;
    m.aiCompleted = run; m.aiDeferred = K - run;
  }

  /* FANOUT: factorized membership and exact lifecycle counts. */
  this.membership(m);

  /* FLUSH: plate-derived estimates, overload observation, ledger. */
  this.estimate(m, st);
  this.observe(m);

  let h = 0x811c9dc5;
  for (let i = 0; i < E; i++) {
    h = Math.imul(h ^ (X[i] & 0xffff), 16777619);
    h = Math.imul(h ^ (Y[i] & 0xffff), 16777619);
  }
  m.checksum = h >>> 0;

  this.tick++;
  this.m = m;
  this.pushLedger(m, st);
  if (this.tick === 1 || this.tick % DEMO.factor_every === 0) this.computeFactors();
  return m;
};

DenseModel.prototype.membership = function (m) {
  const N = this.N, E = this.E, G = this.G, GX = this.GX, GY = this.GY, R = this.R, C = CHUNK_SIZE;
  const Ecur = this.Ecur, Edirty = this.Edirty, Rcur = this.Rcur, cls = this.cls, clsD = this.clsD;
  Ecur.fill(0); Edirty.fill(0); this.diffR.fill(0); cls.fill(0); clsD.fill(0);
  for (let d = 0; d < 9; d++) this.diffD[d].fill(0);
  const hasPrev = this.hasPrev;

  {
    const CH = this.ch, DIRTY = this.dirty, PX = this.px, PY = this.py, X = this.x, Y = this.y;
    for (let i = 0; i < E; i++) {
      const c = CH[i], dt = DIRTY[i];
      Ecur[c]++;
      if (dt) Edirty[c]++;
      if (hasPrev) {
        /* previous chunk offset from last tick's committed position */
        const dx = (PX[i] >> CHUNK_SHIFT) - (X[i] >> CHUNK_SHIFT), dy = (PY[i] >> CHUNK_SHIFT) - (Y[i] >> CHUNK_SHIFT);
        if (dx >= -1 && dx <= 1 && dy >= -1 && dy <= 1) {
          const k = c * 9 + (dx + 1) * 3 + (dy + 1);
          cls[k]++;
          if (dt) clsD[k]++;
        }
      }
    }
  }

  /* Observer rects are chunk aligned, so many observers share one rect.
     Count observers per unclipped rect (origin plus a 0/1 size variant per
     axis), then apply each distinct rect once, weighted by its count. */
  const PAD = Math.ceil(R / C) + 1, SX = GX + 2 * PAD, SY = GY + 2 * PAD;
  const wx = Math.floor(2 * R / C);
  if (!this.rectAll || this.rectAll.length !== SX * SY * 4) {
    this.rectAll = new Int32Array(SX * SY * 4);
    this.rectStable = new Int32Array(SX * SY * 4);
  }
  const rectAll = this.rectAll, rectStable = this.rectStable;
  rectAll.fill(0); rectStable.fill(0);
  const ox0 = this.ox0, oy0 = this.oy0, ox1 = this.ox1, oy1 = this.oy1;
  const pox0 = this.pox0, poy0 = this.poy0, pox1 = this.pox1, poy1 = this.poy1;
  const X = this.x, Y = this.y;
  let nChanged = 0, subs = 0, trans = 0;
  for (let o = 0; o < N; o++) {
    const x = X[o], y = Y[o];
    const ux0 = (x - R) >> CHUNK_SHIFT, uy0 = (y - R) >> CHUNK_SHIFT;
    const ux1 = (x + R) >> CHUNK_SHIFT, uy1 = (y + R) >> CHUNK_SHIFT;
    const qx0 = ox0[o], qy0 = oy0[o], qx1 = ox1[o], qy1 = oy1[o];
    pox0[o] = qx0; poy0[o] = qy0; pox1[o] = qx1; poy1[o] = qy1;
    ox0[o] = ux0; oy0[o] = uy0; ox1[o] = ux1; oy1[o] = uy1;
    subs += (ux1 - ux0 + 1) * (uy1 - uy0 + 1);
    const idx = ((uy0 + PAD) * SX + (ux0 + PAD)) * 4 + (ux1 - ux0 - wx) + 2 * (uy1 - uy0 - wx);
    rectAll[idx]++;
    if (!hasPrev) continue;
    if (ux0 !== qx0 || uy0 !== qy0 || ux1 !== qx1 || uy1 !== qy1) { trans++; this.changed[nChanged++] = o; continue; }
    rectStable[idx]++;
  }
  m.subscriptions = subs; m.obsTrans = trans;
  const diffR = this.diffR, diffD = this.diffD;
  for (let idx = 0; idx < rectAll.length; idx++) {
    const w = rectAll[idx];
    if (w === 0) continue;
    const v = idx & 3, cell = idx >> 2;
    const ux0 = (cell % SX) - PAD, uy0 = Math.floor(cell / SX) - PAD;
    const ux1 = ux0 + wx + (v & 1), uy1 = uy0 + wx + (v >> 1);
    const ax = Math.max(0, ux0), ay = Math.max(0, uy0), bx = Math.min(GX - 1, ux1), by = Math.min(GY - 1, uy1);
    this.addRect(diffR, ax, ay, bx, by, w);
    const ws = rectStable[idx];
    if (ws === 0) continue;
    for (let dx = -1; dx <= 1; dx++) {
      const x0 = Math.max(ax, ax - dx), x1 = Math.min(bx, bx - dx);
      if (x0 > x1) continue;
      for (let dy = -1; dy <= 1; dy++) {
        const y0 = Math.max(ay, ay - dy), y1 = Math.min(by, by - dy);
        if (y0 > y1) continue;
        this.addRect(diffD[(dx + 1) * 3 + (dy + 1)], x0, y0, x1, y1, ws);
      }
    }
  }

  this.integrate(this.diffR, Rcur);
  let visible = 0, groups = 0, refs = 0;
  for (let c = 0; c < G; c++) {
    const e = Ecur[c];
    if (e > 0) {
      refs += Rcur[c];

    }

  let inter = 0, interD = 0, classes = 0;
  if (hasPrev) {
    for (let d = 0; d < 9; d++) this.integrate(this.diffD[d], this.Dg[d]);
    for (let c = 0; c < G; c++) {
      if (Ecur[c] === 0) continue;
      const base = c * 9;
      for (let d = 0; d < 9; d++) {
        const n = cls[base + d];
        if (n === 0) continue;
        classes++;
        const s = this.Dg[d][c];
        inter += n * s; interD += clsD[base + d] * s;
      }
    }
    /* Changed observers: group by (current rect, previous rect delta).
       Observers with identical rect pairs contribute identically, so each
       group is evaluated once and weighted by its size. Exact. */
    const nKeys = rectAll.length * 81;
    if (!this.chgCount || this.chgCount.length !== nKeys) {
      this.chgCount = new Int32Array(nKeys);
      this.chgTouched = new Int32Array(Math.max(16, N));
    }
    const chgCount = this.chgCount, chgTouched = this.chgTouched;
    let nTouched = 0;
    const evalPair = (ux0, uy0, ux1, uy1, pax, pay, pbx, pby) => {
      const ax = Math.max(0, ux0), ay = Math.max(0, uy0);
      const bx = Math.min(GX - 1, ux1), by = Math.min(GY - 1, uy1);
      let a1 = 0, a2 = 0;
      for (let cy = ay; cy <= by; cy++) {

          const c = cy * GX + cx;
          if (Ecur[c] === 0) continue;
          const base = c * 9;
          for (let d = 0; d < 9; d++) {
            const n = cls[base + d];
            if (n === 0) continue;
            const c0x = cx + ((d / 3) | 0) - 1, c0y = cy + (d % 3) - 1;
            if (c0x >= pax && c0x <= pbx && c0y >= pay && c0y <= pby) { a1 += n; a2 += clsD[base + d]; }
          }
        }
      }
      this.pairOut0 = a1; this.pairOut1 = a2;
    };
    for (let k = 0; k < nChanged; k++) {
      const o = this.changed[k];
      const ux0 = ox0[o], uy0 = oy0[o], ux1 = ox1[o], uy1 = oy1[o];
      const d0 = pox0[o] - ux0 + 1, d1 = poy0[o] - uy0 + 1, d2 = pox1[o] - ux1 + 1, d3 = poy1[o] - uy1 + 1;
      if (d0 < 0 || d0 > 2 || d1 < 0 || d1 > 2 || d2 < 0 || d2 > 2 || d3 < 0 || d3 > 2) {
        evalPair(ux0, uy0, ux1, uy1, pox0[o], poy0[o], pox1[o], poy1[o]);
        inter += this.pairOut0; interD += this.pairOut1;
        continue;
      }
      const idx = ((uy0 + PAD) * SX + (ux0 + PAD)) * 4 + (ux1 - ux0 - wx) + 2 * (uy1 - uy0 - wx);
      const key = idx * 81 + ((d0 * 3 + d1) * 3 + d2) * 3 + d3;
      if (chgCount[key]++ === 0) chgTouched[nTouched++] = key;
    }
    for (let t = 0; t < nTouched; t++) {
      const key = chgTouched[t], count = chgCount[key];
      chgCount[key] = 0;
      const dd = key % 81, idx = (key - dd) / 81;
      const v = idx & 3, cell = idx >> 2;
      const ux0 = (cell % SX) - PAD, uy0 = ((cell / SX) | 0) - PAD;

/* Share of dirty visible pairs per tick ring (near, mid, far), counted on
   Chebyshev chunk distance from each observer's own chunk. */
DenseModel.prototype.ringSplit = function (st) {
  const N = this.N, G = this.G, GX = this.GX, GY = this.GY, R = this.R, C = CHUNK_SIZE, Ed = this.Edirty;
  const nearK = Math.floor(st.ring.near / C), midK = Math.floor(st.ring.mid / C);
  const rd = [0, 0, 0];
  /* Group observers by (own chunk, rect origin relative to it, size
     variant). Every observer in a group sees the same chunks at the same
     ring distances, so each group is scanned once. Exact. */
  const RP = Math.ceil(R / C) + 1, RW = RP + 1, wx = Math.floor(2 * R / C);
  const nKeys = G * RW * RW * 4;
  if (!this.ringCount || this.ringCount.length !== nKeys) {
    this.ringCount = new Int32Array(nKeys);
    this.ringTouched = new Int32Array(Math.max(16, Math.min(N, nKeys)));
  }
  const cnt = this.ringCount, touched = this.ringTouched;
  let nT = 0;
  const CH = this.ch, ox0 = this.ox0, oy0 = this.oy0, ox1 = this.ox1, oy1 = this.oy1;
  for (let o = 0; o < N; o++) {
    const oc = CH[o], ocx = oc % GX, ocy = (oc - ocx) / GX;
    const rx = ox0[o] - ocx + RP, ry = oy0[o] - ocy + RP;
    const v = (ox1[o] - ox0[o] - wx) + 2 * (oy1[o] - oy0[o] - wx);
    const key = ((oc * RW + rx) * RW + ry) * 4 + v;
    if (cnt[key]++ === 0) touched[nT++] = key;
  }
  for (let t = 0; t < nT; t++) {
    const key = touched[t], count = cnt[key];
    cnt[key] = 0;
    const v = key & 3;
    let rest = key >> 2;
    const ry = rest % RW; rest = (rest - ry) / RW;
    const rx = rest % RW; const oc = (rest - rx) / RW;
    const ocx = oc % GX, ocy = (oc - ocx) / GX;
    const ux0 = ocx + rx - RP, uy0 = ocy + ry - RP;
    const ux1 = ux0 + wx + (v & 1), uy1 = uy0 + wx + (v >> 1);
    const ax = Math.max(0, ux0), ay = Math.max(0, uy0);
    const bx = Math.min(GX - 1, ux1), by = Math.min(GY - 1, uy1);
    for (let cy = ay; cy <= by; cy++) {
      const dy = Math.abs(cy - ocy), row = cy * GX;
      for (let cx = ax; cx <= bx; cx++) {
        const e = Ed[row + cx];
        if (e === 0) continue;
        const k = Math.max(Math.abs(cx - ocx), dy);
        rd[k <= nearK ? 0 : k <= midK ? 1 : 2] += e * count;
      }
    }
  }
  this.ringDirty = rd;
  const tot = rd[0] + rd[1] + rd[2];
  const ev = st.ring.every;
  const f = tot > 0 ? (rd[0] / ev[0] + rd[1] / ev[1] + rd[2] / ev[2]) / tot : 1;
  return { f: f, share: tot > 0 ? [rd[0] / tot, rd[1] / tot, rd[2] / tot] : [0, 0, 0] };
};

function optOn(st, id) {

/* Network cost for one wire profile at this tick's deliveries. */

  const base = wire === "oracle" ? "compact" : wire;

DenseModel.prototype.estimate = function (m, st) {

  m.simMs = simNs * m.entities / 1e6 * scale * (optOn(st, "kinetic") ? optDef("kinetic").simMul : 1);

  const vals = { tickMs: m.tickMs, simMs: m.simMs, senderMs: m.senderMs, deliveries: m.deliveries,
    enter: m.enter, leave: m.leave, chunkCross: m.chunkCross, bytes: m.bytes };

DenseModel.prototype.percentiles = function (key) {
  const a = this.ledger[key].slice().sort((p, q) => p - q);
  if (!a.length) return [0, 0, 0];

/* Observer x entity visibility matrix, both sorted by chunk, downsampled. */
DenseModel.prototype.computeFactors = function () {
  const N = this.N, E = this.E, G = this.G, GX = this.GX, GY = this.GY;
  const B = 128;

  for (let c = 0; c < G; c++) estart[c + 1] = estart[c] + this.Ecur[c];
  const pcount = new Int32Array(G);
  for (let i = 0; i < N; i++) pcount[this.ch[i]]++;

  for (let c = 0; c < G; c++) pstart[c + 1] = pstart[c] + pcount[c];
  const prun = new Int32Array(G);

  for (let k = 0; k <= cols; k++) colStart[k] = Math.round(k * E / cols);
  const colOf = (s) => Math.min(cols - 1, Math.floor(s * cols / E));

  const full = new Int32Array(rows * (cols + 1));
  const rowCount = new Int32Array(rows);
  const stride = Math.max(1, Math.ceil(N / DEMO.factor_sample_observers));
  for (let o = 0; o < N; o++) {
    const c0 = this.ch[o];
    const rank = pstart[c0] + prun[c0]++;
    if (o % stride !== 0) continue;
    const row = Math.min(rows - 1, Math.floor(rank * rows / N));
    rowCount[row]++;
    const ax = Math.max(0, this.ox0[o]), ay = Math.max(0, this.oy0[o]);
    const bx = Math.min(GX - 1, this.ox1[o]), by = Math.min(GY - 1, this.oy1[o]);
    const rb = row * cols, fb = row * (cols + 1);
    for (let cy = ay; cy <= by; cy++) {
      for (let cx = ax; cx <= bx; cx++) {
        const c = cy * GX + cx;
        const s = estart[c], e = estart[c + 1];
        if (e <= s) continue;
        const k0 = colOf(s), k1 = colOf(e - 1);
        if (k0 === k1) { cell[rb + k0] += e - s; continue; }
        cell[rb + k0] += colStart[k0 + 1] - s;
        cell[rb + k1] += e - colStart[k1];

      const width = colStart[k + 1] - colStart[k];
      const cap = rowCount[rI] * width;

      const t = Math.pow(clamp(v, 0, 1), 0.55);

      img[p + 1] = paper[1] + (ink[1] - paper[1]) * t;

};

const NODE_BY_ID = {};
function laneIndex(id) {
  for (let i = 0; i < LANES.length; i++) if (LANES[i].id === id) return i;
  return 0;
}
function colCX(i) { return GEO.col0 + GEO.colW * i + GEO.colW / 2; }
for (const n of NODES) {
  n.cx = colCX(n.col);
  n.cy = GEO.laneTop + laneIndex(n.lane) * GEO.laneH + GEO.laneH / 2;
  n.w = GEO.nodeW; n.h = GEO.nodeH;
  n.x = n.cx - n.w / 2; n.y = n.cy - n.h / 2;

}
function portL(id, d) { const n = NODE_BY_ID[id]; return [n.x, n.cy + (d || 0)]; }

  layers: { grid: true, heat: true, coverage: true, crossings: false }
};

let alpha = 1;
let playCol = -1;
let hover = null;      /* {type, id} */
let selected = null;   /* {type, id} */
let mapHover = null;   /* {wx, wy, sx, sy} */
const particles = {};

function far() { return cam.z < 0.5; }
function nodeState(n) {
  if (n.configs.indexOf(ST.config) < 0) return "ghost";
  if (n.needsCollision && !ST.collision) return n.id === "coll_validate" ? "bypass" : "ghost";
  return "on";
}
function nodePresent(n) { return nodeState(n) !== "ghost"; }
function edgePresent(e) {
  if (e.configs.indexOf(ST.config) < 0) return false;
  if (e.needsCollision && !ST.collision) return false;
  return true;
}
function curLadder() { return LADDER[model && model.m ? model.m.state : 0]; }
function relatedNode(id) {
  const t = hover && hover.type === "node" ? hover.id : selected && selected.type === "node" ? selected.id : null;
  return t === id;
}
function edgeRelated(e) {
  const t = hover && hover.type === "node" ? hover.id : selected && selected.type === "node" ? selected.id : null;
  if (t) return e.from === t || e.to === t;
  if (hover && hover.type === "panel" && hover.id === "map") return e.from === "map" || e.to === "map";
  return false;
}
function reductionLit() {
  if (hover && hover.type === "reduce") return hover.id + 1;
  if (selected && selected.type === "reduce") return selected.id + 1;
  return 0;
}

function drawEdge(e, m) {
  const on = edgePresent(e);
  if (!on) {
    ctx.save(); ctx.setLineDash([4, 8]);
    ctx.strokeStyle = "rgba(158, 150, 133, 0.55)"; ctx.lineWidth = lw(1);
    polyPath(e.P, 14); ctx.stroke(); ctx.restore();
    return;
  }
  const v = m ? Math.max(0, e.val(m, ST)) : 0;
  const w = 1.4 + Math.min(4.2, 0.55 * Math.log10(1 + v));
  const hl = edgeRelated(e);
  ctx.save();
  ctx.lineJoin = "round"; ctx.lineCap = "butt";
  ctx.strokeStyle = PAL.paper; ctx.lineWidth = lw(w + 6);
  polyPath(e.P, 14); ctx.stroke();
  if (e.dashed) ctx.setLineDash([12, 8]);
  ctx.strokeStyle = hl ? PAL.moss : PAL.ink; ctx.lineWidth = lw(hl ? w + 1.2 : w);
  polyPath(e.P, 14); ctx.stroke();
  ctx.restore();
  const a = e.P[e.P.length - 2], b = e.P[e.P.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const s = 9 + w * 1.6;
  ctx.fillStyle = hl ? PAL.moss : PAL.ink;
  ctx.beginPath();
  ctx.moveTo(b[0], b[1]);
  ctx.lineTo(b[0] - s * Math.cos(ang - 0.42), b[1] - s * Math.sin(ang - 0.42));
  ctx.lineTo(b[0] - s * Math.cos(ang + 0.42), b[1] - s * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawEdgeLabel(e, m) {
  if (!edgePresent(e) || !m || far()) return;
  if (!readable(14)) return;
  const s = e.label(m, ST);

  const x = e.anchor[0], y = e.anchor[1];
  ctx.fillStyle = PAL.paper; ctx.fillRect(x - tw / 2, y - 13, tw, 24);
  ctx.strokeStyle = edgeRelated(e) ? PAL.moss : PAL.chord; ctx.lineWidth = lw(0.9);
  ctx.strokeRect(x - tw / 2, y - 13, tw, 24);
  text(s, x, y + 4, 14, { style: "italic", align: "center" });
}

function updateParticles(dt) {
  if (!model || !model.m) return;
  for (const e of EDGES) {
    let p = particles[e.id];
    if (!p) p = particles[e.id] = { acc: Math.random(), t: [] };
    if (!edgePresent(e)) { p.t.length = 0; continue; }
    const v = Math.max(0, e.val(model.m, ST));
    const rate = v <= 0 ? 0 : clamp(0.4 + 1.05 * Math.log10(1 + v), 0.4, 7.5);
    const speed = e.id === "e_out" ? 560 : 240;
    p.acc += rate * dt;
    while (p.acc >= 1) { p.t.push(0); p.acc -= 1; }
    const dtT = speed * dt / e.len;
    let k = 0;
    for (let i = 0; i < p.t.length; i++) { const t = p.t[i] + dtT; if (t < 1) p.t[k++] = t; }
    p.t.length = k;
  }
}

function drawParticles() {
  for (const e of EDGES) {
    const p = particles[e.id];
    if (!p || !p.t.length || !edgePresent(e)) continue;
    for (const t of p.t) {
      const q = pointAt(e, t);
      ctx.lineWidth = lw(1.4);
      if (e.kind === "group") {
        ctx.beginPath(); ctx.arc(q[0], q[1], 8, 0, Math.PI * 2);
        ctx.fillStyle = PAL.paper; ctx.fill();
        ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(2); ctx.stroke();
        ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, Math.PI * 2); ctx.fillStyle = PAL.ink; ctx.fill();
      } else if (e.kind === "byte") {
        ctx.fillStyle = PAL.ink; ctx.strokeStyle = PAL.paper;
        ctx.fillRect(q[0] - 3.5, q[1] - 3.5, 7, 7); ctx.strokeRect(q[0] - 3.5, q[1] - 3.5, 7, 7);
      } else if (e.kind === "intent") {
        ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, Math.PI * 2);
        ctx.fillStyle = PAL.paper; ctx.fill(); ctx.strokeStyle = PAL.ink; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(q[0], q[1], 4.2, 0, Math.PI * 2);
        ctx.fillStyle = PAL.ink; ctx.fill(); ctx.strokeStyle = PAL.paper; ctx.stroke();
      }
    }
  }
}

/* ==========================================================================
   9. WORLD MAP PLATE
   ========================================================================== */

function mapXf() {
  const a = GEO.mapArea, v = model.sc.view;
  const s = a.w / v.size;
  return { s: s, ox: a.x + a.w / 2 - v.cx * s, oy: a.y + a.h / 2 - v.cy * s };
}

/* Above LIVE_DOT_MAX players the map stops animating dots: one snapshot of
   the world is rendered into an offscreen density image after each rebuild
   and drawn in place of live dots. Overlapping dots darken, so crowd shape
   stays readable. Plates and metrics keep running live. */
const DOT_SNAP_RES = 2048;
let dotSnap = null;
let building = 0; /* player count of a pending rebuild, 0 when idle */
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function dotsLive() { return !model || model.N <= LIVE_DOT_MAX; }
function buildDotSnapshot() {
  dotSnap = null;
  if (dotsLive()) return;
  const sc = model.sc, v = sc.view, a = GEO.mapArea;
  const RES = DOT_SNAP_RES, k = RES / v.size;
  const s = a.w / v.size;
  const base = sc.w < v.size ? 1.9 : clamp(s * 0.75, 1.1, 2.4);
  const half = Math.max(1, Math.round(base * 0.9 / s * k));
  const vx0 = v.cx - v.size / 2, vy0 = v.cy - v.size / 2;
  const cp = new Uint16Array(RES * RES), cn = model.E > model.N ? new Uint16Array(RES * RES) : null;
  const stamp = (buf, i, ring) => {
    const cx = Math.round((model.x[i] + 0.5 + model.jx[i] - vx0) * k), cy = Math.round((model.y[i] + 0.5 + model.jy[i] - vy0) * k);
    const x0 = Math.max(0, cx - half), x1 = Math.min(RES - 1, cx + half - 1);
    const y0 = Math.max(0, cy - half), y1 = Math.min(RES - 1, cy + half - 1);
    for (let y = y0; y <= y1; y++) {
      const row = y * RES;
      for (let x = x0; x <= x1; x++) {
        if (ring && x > cx - half && x < cx + half - 1 && y > cy - half && y < cy + half - 1) continue;
        if (buf[row + x] < 65535) buf[row + x]++;
      }
    }
  };
  for (let i = 0; i < model.N; i++) stamp(cp, i, false);
  for (let i = model.N; i < model.E; i++) stamp(cn, i, true);
  const ink = hexRgb(PAL.ink), paper = hexRgb(PAL.paper), chord = hexRgb(PAL.chord);
  const cv = document.createElement("canvas");
  cv.width = RES; cv.height = RES;
  const g = cv.getContext("2d");
  const img = g.createImageData(RES, RES), d = img.data;
  for (let q = 0; q < RES * RES; q++) {
    const tp = cp[q] ? 1 - Math.exp(-0.8 * cp[q]) : 0;
    const tn = cn && cn[q] ? 1 - Math.exp(-0.8 * cn[q]) : 0;
    if (tp === 0 && tn === 0) { d[q * 4 + 3] = 0; continue; }
    /* paper, then NPC chord, then player ink on top */
    let rC = paper[0] + (chord[0] - paper[0]) * tn, gC = paper[1] + (chord[1] - paper[1]) * tn, bC = paper[2] + (chord[2] - paper[2]) * tn;
    rC += (ink[0] - rC) * tp; gC += (ink[1] - gC) * tp; bC += (ink[2] - bC) * tp;
    const p = q * 4;
    d[p] = rC; d[p + 1] = gC; d[p + 2] = bC;
    d[p + 3] = Math.round(255 * Math.min(1, Math.max(tp, tn) * 1.15));
  }
  g.putImageData(img, 0, 0);
  dotSnap = { canvas: cv, tick: model.tick, n: model.N };
}

/* Many live dots: rasterize squares straight into a pixel buffer covering
   the visible part of the map, then draw that buffer once. Far cheaper than
   filling a path with tens of thousands of sub-rectangles. */
const DOT_PIXEL_MIN = 4000;
const dotBuf = { canvas: null, g: null, img: null, u32: null, capW: 0, capH: 0 };
function rgba32(hex) {
  const c = hexRgb(hex), b = new Uint8Array([c[0], c[1], c[2], 255]);
  return new Uint32Array(b.buffer)[0];
}
function drawPixelDots(a, X, aa, dr) {
  const T = ctx.getTransform(), k = T.a;
  const cw = ctx.canvas.width, chh = ctx.canvas.height;
  const x0 = Math.max(0, Math.floor(k * a.x + T.e)), y0 = Math.max(0, Math.floor(k * a.y + T.f));
  const x1 = Math.min(cw, Math.ceil(k * (a.x + a.w) + T.e)), y1 = Math.min(chh, Math.ceil(k * (a.y + a.h) + T.f));
  const w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return;
  if (!dotBuf.canvas || dotBuf.capW < w || dotBuf.capH < h) {
    dotBuf.capW = Math.ceil(w / 256) * 256; dotBuf.capH = Math.ceil(h / 256) * 256;
    dotBuf.canvas = document.createElement("canvas");
    dotBuf.canvas.width = dotBuf.capW; dotBuf.canvas.height = dotBuf.capH;
    dotBuf.g = dotBuf.canvas.getContext("2d");
    dotBuf.img = dotBuf.g.createImageData(dotBuf.capW, dotBuf.capH);
    dotBuf.u32 = new Uint32Array(dotBuf.img.data.buffer);
  }
  const W = dotBuf.capW, buf = dotBuf.u32;
  buf.fill(0, 0, W * h);
  const ink = rgba32(PAL.ink), paper = rgba32(PAL.paper);
  const sq = (cx, cy, half, col) => {
    let qx0 = Math.round(cx - half) - x0, qy0 = Math.round(cy - half) - y0;
    const side = Math.max(1, Math.round(2 * half));
    let qx1 = qx0 + side, qy1 = qy0 + side;
    if (qx0 < 0) qx0 = 0; if (qy0 < 0) qy0 = 0; if (qx1 > w) qx1 = w; if (qy1 > h) qy1 = h;
    for (let y = qy0; y < qy1; y++) { const row = y * W; for (let x = qx0; x < qx1; x++) buf[row + x] = col; }
  };
  const N = model.N, E = model.E, s = X.s;
  const px = model.px, py = model.py, xx = model.x, yy = model.y, jx = model.jx, jy = model.jy;
  const ox = k * X.ox + T.e, oy = k * X.oy + T.f, ks = k * s;
  const hp = 0.9 * dr * k;
  for (let i = 0; i < N; i++) {
    sq(ox + (px[i] + (xx[i] - px[i]) * aa + 0.5 + jx[i]) * ks, oy + (py[i] + (yy[i] - py[i]) * aa + 0.5 + jy[i]) * ks, hp, ink);
  }
  if (E > N) {
    const bt = Math.max(1, Math.round(dr * 0.6 * k)), ho = 1.7 * dr * k + bt / 2, hi = ho - bt;
    for (let i = N; i < E; i++) {
      const cx = ox + (px[i] + (xx[i] - px[i]) * aa + 0.5 + jx[i]) * ks, cy = oy + (py[i] + (yy[i] - py[i]) * aa + 0.5 + jy[i]) * ks;
      sq(cx, cy, ho, ink);
      if (hi >= 0.5) sq(cx, cy, hi, paper);
    }
  }
  dotBuf.g.putImageData(dotBuf.img, 0, 0, 0, 0, w, h);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(dotBuf.canvas, 0, 0, w, h, x0, y0, w, h);
  ctx.restore();
}

function drawStaticNote(a, snap) {
  if (!readable(9)) return;
  const bw = 452, bh = 92, bx = a.x + 14, by = a.y + 14;
  ctx.fillStyle = "rgba(233, 226, 210, 0.94)"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(1.6); ctx.strokeRect(bx, by, bw, bh);
  ctx.lineWidth = lw(0.8); ctx.strokeRect(bx + 4, by + 4, bw - 8, bh - 8);
  text("STATIC SNAPSHOT" + (snap ? ", TICK " + fmtInt(snap.tick) : ""), bx + 16, by + 28, 15, { style: "bold", color: PAL.rust });
  text(fmtInt(model.N) + " players is too many dots to animate live", bx + 16, by + 52, 15, { style: "italic", color: PAL.ink, max: bw - 30 });
  text("(over " + fmtInt(LIVE_DOT_MAX) + "). Every plate and metric stays live.", bx + 16, by + 74, 15, { style: "italic", color: PAL.ink, max: bw - 30 });
}

function drawMapPlate(m) {
  const r = GEO.map, sc = model.sc;
  plateFrame(r);
  plateHeader(r, "WORLD / TOP-DOWN", sc.title, sc.subtitle);
  const a = GEO.mapArea, X = mapXf(), s = X.s;
  const C = CHUNK_SIZE;
  const vx0 = sc.view.cx - sc.view.size / 2, vy0 = sc.view.cy - sc.view.size / 2;
  const vx1 = vx0 + sc.view.size, vy1 = vy0 + sc.view.size;

  ctx.save();
  ctx.beginPath(); ctx.rect(a.x, a.y, a.w, a.h); ctx.clip();
  ctx.fillStyle = PAL.paper; ctx.fillRect(a.x, a.y, a.w, a.h);
  const o = model.selected;
  const ocx = X.ox + (model.x[o] + 0.5) * s, ocy = X.oy + (model.y[o] + 0.5) * s;
  if (ST.layers.coverage) {
    ctx.fillStyle = PAL.glow;
    ctx.beginPath(); ctx.arc(ocx, ocy, model.R * s, 0, Math.PI * 2); ctx.fill();
  }

  /* heat: deliveries per chunk factor, clipped to the world */
  if (ST.layers.heat && m) {
    let maxER = 0;
    for (let c = 0; c < model.G; c++) { const er = model.Ecur[c] * model.Rcur[c]; if (er > maxER) maxER = er; }
    if (maxER > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(X.ox, X.oy, sc.w * s, sc.h * s); ctx.clip();
      const lm = Math.log(1 + maxER);
      for (let c = 0; c < model.G; c++) {
        const er = model.Ecur[c] * model.Rcur[c];
        if (er <= 0) continue;
        const cx = c % model.GX, cy = Math.floor(c / model.GX);
        ctx.fillStyle = "rgba(185, 176, 149, " + (0.12 + 0.55 * Math.log(1 + er) / lm).toFixed(3) + ")";
        ctx.fillRect(X.ox + cx * C * s, X.oy + cy * C * s, C * s, C * s);
      }
      ctx.restore();
    }
  }
  /* grid */
  if (ST.layers.grid) {
    if (CELL_SIZE * s * cam.z >= 7) {
      ctx.strokeStyle = "rgba(158, 150, 133, 0.45)"; ctx.lineWidth = lw(0.6);
      ctx.beginPath();
      for (let gx = Math.floor(vx0 / CELL_SIZE) * CELL_SIZE; gx <= vx1; gx += CELL_SIZE) { ctx.moveTo(X.ox + gx * s, a.y); ctx.lineTo(X.ox + gx * s, a.y + a.h); }
      for (let gy = Math.floor(vy0 / CELL_SIZE) * CELL_SIZE; gy <= vy1; gy += CELL_SIZE) { ctx.moveTo(a.x, X.oy + gy * s); ctx.lineTo(a.x + a.w, X.oy + gy * s); }
      ctx.stroke();
    }
    ctx.strokeStyle = PAL.chord; ctx.lineWidth = lw(1.1);
    ctx.beginPath();
    for (let gx = Math.floor(vx0 / C) * C; gx <= vx1; gx += C) { ctx.moveTo(X.ox + gx * s, a.y); ctx.lineTo(X.ox + gx * s, a.y + a.h); }
    for (let gy = Math.floor(vy0 / C) * C; gy <= vy1; gy += C) { ctx.moveTo(a.x, X.oy + gy * s); ctx.lineTo(a.x + a.w, X.oy + gy * s); }
    ctx.stroke();
  }

  /* selected observer coverage */
  if (ST.layers.coverage && m) {
    const rx = X.ox + model.ox0[o] * C * s, ry = X.oy + model.oy0[o] * C * s;
    const rw = (model.ox1[o] - model.ox0[o] + 1) * C * s, rh = (model.oy1[o] - model.oy0[o] + 1) * C * s;
    ctx.fillStyle = "rgba(28, 26, 22, 0.06)"; ctx.fillRect(rx, ry, rw, rh);
    ctx.save(); ctx.setLineDash([10, 6]);
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(1.4); ctx.strokeRect(rx, ry, rw, rh);
    ctx.strokeStyle = PAL.chord; ctx.lineWidth = lw(1.8);
    ctx.beginPath(); ctx.arc(ocx, ocy, model.R * s, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  /* tick rings: Chebyshev chunk rings around the selected observer */
  if (optOn(ST, "rings") && m) {
    const ocx0 = Math.floor(model.x[o] / C), ocy0 = Math.floor(model.y[o] / C);
    const nk = Math.floor(ST.ring.near / C), mk = Math.floor(ST.ring.mid / C);
    const ringRect = (k) => [X.ox + (ocx0 - k) * C * s, X.oy + (ocy0 - k) * C * s, (2 * k + 1) * C * s];
    const mr = ringRect(mk), nr = ringRect(nk);
    ctx.fillStyle = "rgba(85, 122, 104, 0.10)"; ctx.fillRect(mr[0], mr[1], mr[2], mr[2]);
    ctx.fillStyle = "rgba(85, 122, 104, 0.16)"; ctx.fillRect(nr[0], nr[1], nr[2], nr[2]);
    ctx.strokeStyle = PAL.moss; ctx.lineWidth = lw(1.6);
    ctx.strokeRect(mr[0], mr[1], mr[2], mr[2]); ctx.strokeRect(nr[0], nr[1], nr[2], nr[2]);
    const ev = ST.ring.every;
    if (readable(13)) {
      const lines = ["near: every " + ev[0], "mid: every " + ev[1], "far: every " + ev[2]];
      font(13, "bold");
      const lw0 = Math.max(measure(lines[0]), measure(lines[1]), measure(lines[2])) + 16;
      const lx = clamp(mr[0] - lw0 - 10, a.x + 6, a.x + a.w - lw0 - 6), ly = clamp(mr[1], a.y + 6, a.y + a.h - 66);
      ctx.fillStyle = "rgba(233, 226, 210, 0.92)"; ctx.fillRect(lx, ly, lw0, 60);
      ctx.strokeStyle = PAL.moss; ctx.lineWidth = lw(1); ctx.strokeRect(lx, ly, lw0, 60);
      for (let k = 0; k < 3; k++) text(lines[k], lx + 8, ly + 17 + k * 18, 13, { style: "bold", color: PAL.moss });
    }
  }

  /* world bounds */
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(sc.w < sc.view.size ? 3.2 : 2);
  ctx.strokeRect(X.ox, X.oy, sc.w * s, sc.h * s);

  /* entities */
  const N = model.N, E = model.E, aa = alpha;
  const base = sc.w < sc.view.size ? 1.9 : clamp(s * 0.75, 1.1, 2.4);
  const dr = Math.max(base, 0.65 / cam.z);
  const px = model.px, py = model.py, xx = model.x, yy = model.y, jx = model.jx, jy = model.jy;
  const snap = !dotsLive() && dotSnap && dotSnap.n === N ? dotSnap : null;
  if (snap) {
    ctx.save();
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(snap.canvas, a.x, a.y, a.w, a.h);
    ctx.restore();
    /* the live observer's coverage stays legible over a dense snapshot */
    if (ST.layers.coverage && m) {
      const rx = X.ox + model.ox0[o] * C * s, ry = X.oy + model.oy0[o] * C * s;
      const rw = (model.ox1[o] - model.ox0[o] + 1) * C * s, rh = (model.oy1[o] - model.oy0[o] + 1) * C * s;
      ctx.save();
      ctx.strokeStyle = PAL.paper; ctx.lineWidth = lw(4);
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.beginPath(); ctx.arc(ocx, ocy, model.R * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([10, 6]); ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(1.6);
      ctx.strokeRect(rx, ry, rw, rh);
      ctx.beginPath(); ctx.arc(ocx, ocy, model.R * s, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  } else if (dotsLive() && N > DOT_PIXEL_MIN) {
    drawPixelDots(a, X, aa, dr);
  } else if (dotsLive()) {
    ctx.fillStyle = PAL.ink;
    ctx.beginPath();
    if (N <= 4000) {
      for (let i = 0; i < N; i++) {
        const X0 = X.ox + (px[i] + (xx[i] - px[i]) * aa + 0.5 + jx[i]) * s;
        const Y0 = X.oy + (py[i] + (yy[i] - py[i]) * aa + 0.5 + jy[i]) * s;
        ctx.moveTo(X0 + dr, Y0); ctx.arc(X0, Y0, dr, 0, Math.PI * 2);
      }
    } else {
      const d2 = dr * 1.8;
      for (let i = 0; i < N; i++) {
        const X0 = X.ox + (px[i] + (xx[i] - px[i]) * aa + 0.5 + jx[i]) * s;
        const Y0 = X.oy + (py[i] + (yy[i] - py[i]) * aa + 0.5 + jy[i]) * s;
        ctx.rect(X0 - dr, Y0 - dr, d2, d2);
      }
    }
    ctx.fill();
    if (E > N) {
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(dr * 0.6);
      ctx.beginPath();
      const rr = dr * 1.7;
      for (let i = N; i < E; i++) {
        const X0 = X.ox + (px[i] + (xx[i] - px[i]) * aa + 0.5 + jx[i]) * s;
        const Y0 = X.oy + (py[i] + (yy[i] - py[i]) * aa + 0.5 + jy[i]) * s;
        ctx.moveTo(X0 + rr, Y0); ctx.arc(X0, Y0, rr, 0, Math.PI * 2);
      }
      ctx.fillStyle = PAL.paper; ctx.fill(); ctx.stroke();
    }
  }
  if (ST.layers.crossings && !snap) {
    ctx.strokeStyle = PAL.rust; ctx.lineWidth = lw(1.4);
    ctx.beginPath();
    const cr = dr * 3;
    for (let i = 0; i < E; i++) {
      if (!model.crossed[i]) continue;
      const X0 = X.ox + (xx[i] + 0.5 + jx[i]) * s, Y0 = X.oy + (yy[i] + 0.5 + jy[i]) * s;
      ctx.moveTo(X0 + cr, Y0); ctx.arc(X0, Y0, cr, 0, Math.PI * 2);
    }
    ctx.stroke();
  }

  /* anchor marker: the plate's ring-and-dot */
  const sx = X.ox + (px[o] + (xx[o] - px[o]) * aa + 0.5 + jx[o]) * s;
  const sy = X.oy + (py[o] + (yy[o] - py[o]) * aa + 0.5 + jy[o]) * s;
  const mr = Math.max(9, 4 / cam.z);
  ctx.fillStyle = PAL.paper; ctx.beginPath(); ctx.arc(sx, sy, mr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(2.4); ctx.stroke();
  ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(sx, sy, mr * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* plate-style annotations */
  if (ST.layers.coverage) {
    const lx = Math.min(a.x + a.w - 20, ocx + model.R * s * 0.72), ly = ocy - model.R * s * 0.72;
    const tx0 = clamp(lx + 30, a.x + 20, a.x + a.w - 20), ty0 = clamp(ly - 44, a.y + 30, a.y + a.h - 20);
    if (lx > a.x && ly > a.y) {
      ctx.strokeStyle = PAL.chord; ctx.lineWidth = lw(0.9);
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(tx0, ty0 + 6); ctx.stroke();
      text("radius-" + model.R + " observer", tx0, ty0, 16, { style: "italic", color: PAL.chord, align: tx0 > a.x + a.w - 200 ? "right" : "left" });
    }
  }
  if (sc.w < sc.view.size) {
    const bx = X.ox, by = X.oy + sc.h * s;
    ctx.strokeStyle = PAL.chord; ctx.lineWidth = lw(0.9);
    ctx.beginPath(); ctx.moveTo(bx + 8, by + 2); ctx.lineTo(a.x + 120, a.y + a.h - 46); ctx.stroke();
    text(sc.w + " x " + sc.h + " box, " + fmtInt(model.N) + " players", a.x + 26, a.y + a.h - 26, 16, { style: "italic", color: PAL.chord });
  }
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = lw(2.4);
  ctx.strokeRect(a.x, a.y, a.w, a.h);
  if (!dotsLive()) drawStaticNote(a, snap);

  if (!m) return;
  /* readout column, left of the map */
  const rx = r.x + 44, cw0 = 430;
  let y0 = 214;
  heading("THE SCENARIO", rx, y0, cw0);
  const left = [fmtInt(model.N) + " players" + (model.K ? ", " + fmtInt(model.K) + " NPC agents" : "")]
    .concat(sc.notes.slice(1)).concat(["radius " + model.R + " / chunk " + CHUNK_SIZE + " / cell " + CELL_SIZE]);
  for (let k = 0; k < left.length; k++) {
    bullet(rx, y0 + 44 + k * 30);
    text(left[k], rx + 30, y0 + 44 + k * 30, 17, { max: cw0 - 34 });
  }
  y0 = 420;
  heading("THIS TICK", rx, y0, cw0);
  const right = [fmtInt(m.deliveries) + " implied deliveries", "ENTER " + fmtInt(m.enter) + " / LEAVE " + fmtInt(m.leave),
    fmtInt(m.visible) + " visible pairs", fmtInt(m.chunkCross) + " chunk crossings",
    fmtInt(m.groups) + " groups / " + fmtInt(m.refs) + " refs",
    optOn(ST, "rings") ? "rings near/mid/far " + fmtPct(m.ringShare[0]) + " / " + fmtPct(m.ringShare[1]) + " / " + fmtPct(m.ringShare[2])
      : "tick " + fmtMs(m.tickMs) + " ms of " + fmtMs(m.budgetMs) + " ms budget"];
  for (let k = 0; k < right.length; k++) {
    bullet(rx, y0 + 44 + k * 30);
    text(right[k], rx + 30, y0 + 44 + k * 30, 17, { max: cw0 - 34 });
  }
  y0 = 656;
  heading("SELECTED OBSERVER", rx, y0, cw0);
  const ow = model.ox1[o] - model.ox0[o] + 1, oh = model.oy1[o] - model.oy0[o] + 1;
  let seen = 0;
  for (let cy = Math.max(0, model.oy0[o]); cy <= Math.min(model.GY - 1, model.oy1[o]); cy++)
    for (let cx = Math.max(0, model.ox0[o]); cx <= Math.min(model.GX - 1, model.ox1[o]); cx++) seen += model.Ecur[cy * model.GX + cx];
  text("player #" + o + " at (" + model.x[o] + ", " + model.y[o] + ")", rx, y0 + 44, 17);
  text("A_t(o): " + ow + " x " + oh + " chunks / sees " + fmtInt(seen) + " entities", rx, y0 + 72, 17, { max: cw0 });
  wrap("coverage is the inclusive chunk rectangle from (x - r, y - r) to (x + r, y + r), not an exact circle; click any black dot to move the observer",
    rx, y0 + 100, cw0, 20, 14, { style: "italic", color: PAL.chord });
  rule(rx, r.y + r.h - 78, cw0, PAL.chord, 0.8);
  text(sc.footer, rx + cw0 / 2, r.y + r.h - 48, 17, { style: "italic", align: "center", color: PAL.chord, max: cw0 });
}

function drawLegend() {
  const r = GEO.legend;
  plateFrame(r);
  plateHeader(r, "HOW TO READ", "KEY", "one tick of libdense, engraved as a plate");

function render() {

  ctx.textBaseline = "alphabetic";

  if (inView(GEO.board, 200)) {
    drawBoard(m);
    for (const e of EDGES) if (!edgePresent(e)) drawEdge(e, m);
  }
  for (const e of EDGES) if (edgePresent(e)) drawEdge(e, m);
  if (inView(GEO.board, 200)) for (const n of NODES) drawNode(n, m);
  drawParticles();
  for (const e of EDGES) drawEdgeLabel(e, m);
  if (model && inView(GEO.map)) drawMapPlate(m);

  for (const e of EDGES) if ((e.id === "e_in" || e.id === "e_out")) drawEdgeLabel(e, m);
  drawParticlesFor(["e_in", "e_out"]);

}

function option(el, value, label) {

function ensureOption(el, value, label) {

}
function presetById(id) { return PRESETS.find((p) => p.id === id) || null; }
function applyPresetValues(id) {
  const pr = presetById(id);

  const v = pr.s;

}
function applyParams(q) {
  if (q.preset && presetById(q.preset)) applyPresetValues(q.preset);
  if (q.config && CONFIGS[q.config]) ST.config = q.config;
  if (q.scenario && SCENARIOS[q.scenario]) ST.scenario = q.scenario;
  if (q.players && Math.floor(+q.players) >= 1 && +q.players <= MAX_PLAYERS) { ST.players = Math.round(+q.players); ensureOption(sel.players, ST.players, fmtInt(ST.players)); }
  if (q.radius && RADII.indexOf(+q.radius) >= 0) ST.radius = +q.radius;
  if (q.wire && WIRE_PROFILES.some((p) => p.id === q.wire)) ST.wire = q.wire;
  if (q.db === "wb" || q.db === "sync") ST.db = q.db;
  if (q.hz && TICK_RATES.some((t) => t.id === q.hz)) { ST.hz = q.hz; ST.hzv = tickRate(q.hz).hz; }
  if (q.budget && +q.budget > 0) { ST.budget = +q.budget; ensureOption(sel.budget, ST.budget, fmtMs(ST.budget) + " ms"); }
  if (q.cpu && CPU_PROFILES.some((c) => c.id === q.cpu)) ST.cpu = q.cpu;
  if (q.workers && WORKERS.indexOf(+q.workers) >= 0) ST.workers = +q.workers;
  if (q.collision === "0" || q.collision === "1") ST.collision = q.collision === "1";
  if (q.egress && EGRESS_LINKS_GBPS.indexOf(+q.egress) >= 0) ST.egress = +q.egress;
  if (q.npc && NPC_SHARES.indexOf(+q.npc) >= 0) ST.npc = +q.npc;
  if (q.rings === "1" || q.rings === "0") ST.opts.rings = q.rings === "1";
  if (q.ring) {
    const r = q.ring.split(",").map(Number);
    if (r.length === 5 && r.every((v) => isFinite(v))) {
      ST.ring = { policy: "custom", near: r[0], mid: Math.max(r[0], r[1]), every: [r[2], r[3], r[4]].map((v) => Math.max(1, Math.round(v))) };
    }
  }
  if (q.opts !== undefined) {
    const on = q.opts.split(",");
    for (const o of OPTS) if (!o.locked && o.id !== "rings") ST.opts[o.id] = on.indexOf(o.id) >= 0;
  }
  if (q.tps !== undefined) { for (const r of RATES) if (r.v === +q.tps) ST.tps = r.v; }

}

function rebuild() {
  model = new DenseModel({ config: ST.config, scenario: ST.scenario, players: ST.players, radius: ST.radius, npc: ST.npc });
  for (const k in particles) delete particles[k];
  factorTick = -2;
  /* pre-roll past the initial ENTER plan, like the benchmark warmup */
  for (let i = 0; i <= DEMO.warmup_ticks; i++) model.step(ST);
  model.computeFactors();
  buildDotSnapshot();
  alpha = 1;
  afterTick();
}
function markDirty() { ST.presetDirty = true; }

/* Large populations take seconds to place and warm up, so the rebuild runs
   after a frame that shows a building note. Rapid changes coalesce. */
let buildToken = 0;
function requestRebuild(after) {
  const token = ++buildToken;
  if (ST.players <= LIVE_DOT_MAX) { building = 0; rebuild(); if (after) after(); return; }
  building = ST.players;
  statusEl.textContent = "building " + fmtInt(ST.players) + " players";
  requestRender();
  requestAnimationFrame(() => setTimeout(() => {
    if (token !== buildToken) return;
    rebuild();
    building = 0;
    if (ST.players > LIVE_DOT_MAX) flashHint("map dots are a static snapshot above " + fmtInt(LIVE_DOT_MAX) + " players");
    if (after) after();
    requestRender();
  }, 0));
}

/* Re-run estimates against the current tick without advancing the world. */
function onChanged(structural) {
  syncControls();
  if (structural) requestRebuild();
  else if (model && model.m) {
    for (const k of model.ledgerKeys) model.ledger[k].length = 0;
    model.m.collisionOn = !!(ST.collision && CONFIGS[ST.config].collision);
    model.estimate(model.m, ST);
    model.pushLedger(model.m, ST);
    afterTick();
  }
  writeHash();
  requestRender();
}

function readControls() {

  ST.cpu = sel.cpu.value; ST.workers = +sel.workers.value; ST.collision = sel.collision.value === "1";
  ST.npc = +sel.npc.value; ST.db = sel.db.value; ST.scenario = sel.scenario.value; ST.players = +sel.players.value;
  ST.radius = +sel.radius.value; ST.wire = sel.wire.value; ST.egress = +sel.egress.value; ST.tps = +sel.tps.value;
  return prev.config !== ST.config || prev.scenario !== ST.scenario || prev.players !== ST.players ||
    prev.radius !== ST.radius || prev.npc !== ST.npc;
}

/* Render the whole board into an offscreen canvas at the given scale, or
   return null when the browser cannot allocate or draw that size. */
function renderExport(scale) {
  const R = EXPORT_PNG.rect;
  const W = Math.round(R.w * scale), H = Math.round(R.h * scale);
  let cv, c2;
  try {
    cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    c2 = cv.getContext("2d");
  } catch (err) { return null; }
  if (!c2 || cv.width !== W || cv.height !== H) return null;
  const saved = { ctx: ctx, dpr: dpr, vw: vw, vh: vh, x: cam.x, y: cam.y, z: cam.z, hover: hover, selected: selected,
    mapHover: mapHover, playCol: playCol, alpha: alpha };
  try {
    ctx = c2; dpr = 1; vw = W; vh = H;
    cam.x = R.x + R.w / 2; cam.y = R.y + R.h / 2; cam.z = scale;
    hover = null; selected = null; mapHover = null; playCol = -1; alpha = 1;
    measureCache.clear();
    render();
    drawExportCaption();
  } catch (err) {
    cv = null;
  } finally {
    ctx = saved.ctx; dpr = saved.dpr; vw = saved.vw; vh = saved.vh;
    cam.x = saved.x; cam.y = saved.y; cam.z = saved.z;
    hover = saved.hover; selected = saved.selected; mapHover = saved.mapHover; playCol = saved.playCol; alpha = saved.alpha;
    measureCache.clear();
  }
  if (!cv) return null;
  /* some browsers return a blank canvas past their size limit */
  try {
    const px = c2.getImageData(4, 4, 1, 1).data;
    if (px[3] === 0) return null;
  } catch (err) { return null; }

}
let exporting = false;
function exportPng() {
  if (!model || !model.m || building) { flashHint("still building, try again in a moment"); return; }
  if (exporting) return;
  exporting = true;
  flashHint("rendering PNG");
  const wasRunning = ST.running;
  const tryScale = (i) => {
    if (i >= EXPORT_PNG.scales.length) { exporting = false; flashHint("PNG export failed: canvas too large for this browser"); return; }
    const cv = renderExport(EXPORT_PNG.scales[i]);
    if (!cv) { tryScale(i + 1); return; }
    cv.toBlob((blob) => {
      if (!blob) { tryScale(i + 1); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = pngFileName();
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
      exporting = false;
      flashHint("PNG downloaded, " + cv.width + " x " + cv.height + " px");
      cv.width = 1; cv.height = 1;
    }, "image/png");
  };
  ST.running = false;
  requestAnimationFrame(() => setTimeout(() => {
    try { tryScale(0); } finally { ST.running = wasRunning; requestRender(); }

let lastStatus = 0;
let lastStepMs = 0;
let lastStepEnd = 0;
const tickTimes = [];
function doTick() {
  if (!model || building) return;
  const t0 = performance.now();
  model.step(ST);
  lastStepEnd = performance.now();
  lastStepMs = lastStepEnd - t0;
  tickTimes.push(lastStepEnd);
  while (tickTimes.length && tickTimes[0] < lastStepEnd - PLAYBACK.rate_window_ms) tickTimes.shift();
  afterTick();
}

/* ticks per second actually achieved while playing, or 0 if unknown */
function achievedRate() {
  if (!ST.running || tickTimes.length < 3) return 0;
  return (tickTimes.length - 1) * 1000 / (tickTimes[tickTimes.length - 1] - tickTimes[0]);
}
function playRate() { return ST.tps > 0 ? ST.tps : ST.hzv; }
function afterTick() {
  const m = model.m;
  if (!m) return;
  const cfg = CONFIGS[ST.config];
  const rate = playRate();
  const got = heavySteps() ? achievedRate() : 0;
  const limited = got > 0 && got < rate * 0.9;
  statusEl.textContent = "tick " + fmtInt(m.tick) + " / " + (cfg.sched ? LADDER[m.state].name.toLowerCase() : "no scheduler") +
    " / playing " + fmtHz(limited ? got : rate) + " of " + fmtHz(ST.hzv) + (limited ? ", browser-limited" : "");
  statusEl.title = limited ?
    "each viewer step of " + fmtInt(model.N) + " players takes about " + Math.round(lastStepMs) + " ms in this browser, so playback is slowed to keep the canvas responsive; the plates still model the selected tick rate" :
    "playback is x" + (rate / ST.hzv).toFixed(2) + " of real time";

function uiInsets() {
  const ar = app.getBoundingClientRect();
  const b = barEl.getBoundingClientRect(), v = viewsEl.getBoundingClientRect();
  let left = 0;
  if (!drawer.hidden && vw >= 900) left = drawer.getBoundingClientRect().right - ar.left + 4;
  return { top: b.bottom - ar.top + 8, bottom: ar.bottom - v.top + 8, left: left };
}
function fitRect(r, animate) {
  const ins = uiInsets();
  const pad = 16;
  const aw = Math.max(80, vw - ins.left - 2 * pad), ah = Math.max(80, vh - ins.top - ins.bottom - 2 * pad);
  const z = clamp(Math.min(aw / r.w, ah / r.h), ZMIN, ZMAX);
  const syc = ins.top + pad + ah / 2, sxc = ins.left + pad + aw / 2;
  const target = { x: r.x + r.w / 2 - (sxc - vw / 2) / z, y: r.y + r.h / 2 - (syc - vh / 2) / z, z: z };
  moveCam(target, animate);

function moveCam(target, animate) {
  if (!animate || reducedMotion) { cam.x = target.x; cam.y = target.y; cam.z = target.z; camAnim = null; requestRender(); return; }
  camAnim = { from: { x: cam.x, y: cam.y, z: cam.z }, to: target, t0: performance.now(), dur: 460 };
  requestRender();
}
function stepCamera(now) {
  if (!camAnim) return;
  const t = clamp((now - camAnim.t0) / camAnim.dur, 0, 1);
  const k = 1 - Math.pow(1 - t, 3);
  const f = camAnim.from, g = camAnim.to;
  cam.z = Math.exp(Math.log(f.z) + (Math.log(g.z) - Math.log(f.z)) * k);
  cam.x = f.x + (g.x - f.x) * k; cam.y = f.y + (g.y - f.y) * k;

/* ---------------- hit testing ---------------- */

const PLATE_KEYS = ["map", "factors", "wire", "ladder", "ledger", "legend", "opts", "bandwidth", "cpu", "preset"];
function inside(r, x, y) { return x >= r.x && y >= r.y && x <= r.x + r.w && y <= r.y + r.h; }
function hitTest(wx, wy) {
  for (let i = NODES.length - 1; i >= 0; i--) if (inside(NODES[i], wx, wy)) return { type: "node", id: NODES[i].id };
  if (inside(GEO.sched, wx, wy)) return { type: "panel", id: "sched" };
  if (inside(GEO.core, wx, wy)) return { type: "panel", id: "core" };
  if (inside(GEO.reduce, wx, wy)) return { type: "reduce", id: clamp(Math.floor((wx - GEO.reduce.x) / (GEO.reduce.w / 5)), 0, 4) };
  if (inside(GEO.mapArea, wx, wy)) return { type: "mapArea", id: "map" };
  for (const k of PLATE_KEYS) if (inside(GEO[k], wx, wy)) return { type: "panel", id: k };
  return null;
}
function samePick(a, b) { return (!a && !b) || (a && b && a.type === b.type && a.id === b.id); }
function pickPlayer(wx, wy) {
  const X = mapXf();
  const lx = (wx - X.ox) / X.s, ly = (wy - X.oy) / X.s;
  let best = -1, bd = Infinity;
  for (let i = 0; i < model.N; i++) {
    const dx = model.x[i] + 0.5 + model.jx[i] - lx, dy = model.y[i] + 0.5 + model.jy[i] - ly;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return Math.sqrt(bd) * X.s * cam.z <= 14 ? best : -1;
}
