function apiList(api) {
  if (!api.length) return "";
  return "<h3>PUBLIC SEAMS</h3><ul>" + api.map((a) => "<li><code>" + esc(a) + "</code></li>").join("") + "</ul>";
}
function renderInspector() {
  if (!selected || !model || !model.m) { inspector.hidden = true; return; }
  const m = model.m, cfg = CONFIGS[ST.config], lad = LADDER[m.state];
  let h = "";
  const top = (mod) => '<div class="top"><span>' + esc(mod.toUpperCase()) + '</span><button type="button" id="insp-close">CLOSE</button></div>';
  if (selected.type === "node") {
    const n = NODE_BY_ID[selected.id];
    const state = nodeState(n);
    h += top(n.mod);
    h += "<h2>" + esc(n.title) + "</h2>";
    h += '<div class="phase">DSC_PHASE_' + esc(PHASES[n.col]) + " / lane: " + esc(LANES[laneIndex(n.lane)].label) + "</div>";
    if (state === "ghost") h += '<p class="note">Not active in the ' + esc(cfg.label) + " configuration" + (n.needsCollision && !ST.collision ? " with collision checks off" : "") + ".</p>";
    if (state === "bypass") h += '<p class="note">Collision checks are off: proposals commit unvalidated, with no rejection and no collision cost.</p>';
    h += "<p>" + esc(n.desc) + "</p>";
    h += apiList(n.api);
    if (state !== "ghost") {
      const rows = n.lines(m, ST).slice();
      if (n.budget && cfg.sheds) rows.push(["ladder budget (" + lad.name.toLowerCase() + ")", "x" + lad[n.budget].toFixed(2)]);
      h += "<h3>THIS TICK</h3>" + rowsTable(rows);
    }
    if (n.tags.length) h += "<h3>REDUCTIONS SERVED</h3>" + chipList(n.tags.map((t) => "<span>" + esc(REDUCTIONS[t - 1].n + " " + REDUCTIONS[t - 1].title.toLowerCase()) + "</span>"));
    h += "<h3>LINKED IN</h3>" + configChips(n.configs);
  } else if (selected.type === "reduce") {
    const R = REDUCTIONS[selected.id];
    h += top(LINKS.bookTitle);
    h += "<h2>" + esc(R.n + " / " + R.title) + "</h2>";
    h += '<div class="phase">Appendix C: the final mental model</div>';
    h += "<p>" + esc(R.ex) + ".</p>";
    const ns = NODES.filter((n) => n.tags.indexOf(selected.id + 1) >= 0);
    h += "<h3>NODES SERVING IT</h3><ul>" + ns.map((n) => "<li>" + esc(n.title) + " <i>(" + esc(n.mod) + ")</i></li>").join("") + "</ul>";
    h += '<p><a href="' + esc(LINKS.book) + '" target="_blank" rel="noopener noreferrer">Get the book</a></p>';
  } else {
    const P = PANELS[selected.id] || PANELS.map;
    h += top(P.mod);
    h += "<h2>" + esc(P.title) + "</h2>";
    h += '<div class="phase">' + esc(P.phase) + "</div>";
    h += "<p>" + esc(P.desc) + "</p>";
    h += apiList(P.api);
    let rows = null;
    if (selected.id === "sched") {
      rows = cfg.sched ? [["state", lad.name], ["pressure", m.pressure.toFixed(2) + " x budget"], ["budget", fmtMs(m.budgetMs) + " ms"],
        ["period", fmtMs(m.periodMs) + " ms"], ["tick", fmtMs(m.tickMs) + " ms"], ["busiest", m.busiest]]
        : [["scheduler", "not linked"]];
    } else if (selected.id === "map") {
      const o = model.selected;
      rows = [["selected player", "#" + o], ["position", model.x[o] + ", " + model.y[o]],
        ["coverage chunks", (model.ox1[o] - model.ox0[o] + 1) + " x " + (model.oy1[o] - model.oy0[o] + 1)],
        ["players / NPC agents", fmtInt(model.N) + " / " + fmtInt(model.K)], ["observer transitions", fmtInt(m.obsTrans)],
        ["subscriptions", fmtInt(m.subscriptions)]];
      if (optOn(ST, "rings")) rows.push(["ring shares near/mid/far", m.ringShare.map(fmtPct).join(" / ")]);
    } else if (selected.id === "factors") {
      rows = [["visible pairs", fmtInt(m.visible)], ["entities + subscriptions", fmtInt(model.E + m.subscriptions)],
        ["groups", fmtInt(m.groups)], ["subscriber refs", fmtInt(m.refs)], ["transition classes", fmtInt(m.classes)],
        ["UPDATE / ENTER / LEAVE", fmtInt(m.update) + " / " + fmtInt(m.enter) + " / " + fmtInt(m.leave)]];
    } else if (selected.id === "wire" && cfg.net) {
      rows = WIRE_PROFILES.map((p) => { const c = model.netCost(m, ST, p.id); return [p.label, fmtBytes(c.bytes) + " / " + fmtMs(c.senderMs) + " ms"]; });
      rows.push(["SDK retained (" + profileLabel(ST.wire) + ")", fmtInt(m.sdkMb) + " MB"]);
    } else if (selected.id === "ladder") {
      rows = [["state", lad.name], ["input", "x" + lad.input.toFixed(2)], ["replication", "x" + lad.repl.toFixed(2)],
        ["AI / nav", "x" + lad.ai.toFixed(2) + " / x" + lad.nav.toFixed(2)], ["replication quality", lad.quality], ["admission", lad.admission],
        ["transitions this run", fmtInt(model.ovl.transitions)]];
    } else if (selected.id === "ledger") {
      rows = model.ledgerKeys.map((k) => { const p = model.percentiles(k); const f = (k === "bytes") ? fmtBytes : (k.indexOf("Ms") > 0) ? fmtMs : fmtInt; return [k + " p50 / p99", f(p[0]) + " / " + f(p[2])]; });
    } else if (selected.id === "bandwidth" && cfg.net) {
      rows = [["egress", fmtGbps(m.egressGbps) + " Gbit/s"], ["ingress", fmtGbps(m.ingressGbps) + " Gbit/s"], ["link use", fmtPct(m.linkUse)],
        ["egress / month", fmtTB(m.egressTBMonth)], ["ingress / month", fmtTB(m.ingressTBMonth)]];
    } else if (selected.id === "cpu") {
      rows = [["profile", cpuProfile(ST.cpu).label], ["tick", fmtMs(m.tickMs) + " ms"], ["sender wall / CPU", fmtMs(m.senderMs) + " / " + fmtMs(m.senderCpuMs) + " ms"]];
    } else if (selected.id === "preset") {
      const pr = presetById(ST.preset);
      h += "<h3>SOURCES</h3><ul>" + pr.sources.map((s) => '<li><a href="' + esc(s.u) + '" target="_blank" rel="noopener noreferrer">' + esc(s.t) + "</a></li>").join("") + "</ul>";
    }
    if (rows) h += "<h3>THIS TICK</h3>" + rowsTable(rows);
  }
  inspector.innerHTML = h;
  inspector.hidden = false;
  const c = $("insp-close");
  if (c) c.addEventListener("click", () => { selected = null; inspector.hidden = true; requestRender(); });
  layoutUi();
}
function select(pick) {
  selected = pick ? (pick.type === "mapArea" ? { type: "panel", id: "map" } : pick) : null;
  renderInspector();
  requestRender();
}

/* ---------------- pointer, wheel, keys ---------------- */

const pointers = new Map();
let drag = null, pinch = null, activated = !embedded, hintTimer = 0, hintSeen = false;

function localXY(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener("pointerdown", (e) => {
  canvas.focus({ preventScroll: true });
  activated = true;
  if (!hintSeen) { hintSeen = true; setTimeout(() => { if (!hintEl.classList.contains("flash")) hintEl.classList.add("gone"); }, 5000); }
  canvas.setPointerCapture(e.pointerId);
  const p = localXY(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 1) { drag = { sx: p[0], sy: p[1], cx: cam.x, cy: cam.y, moved: false }; camAnim = null; }
  else if (pointers.size === 2) {
    const a = Array.from(pointers.values());
    pinch = { d: Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]), z: cam.z,
      mid: screenToWorld((a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2) };
    drag = null;
  }
});
canvas.addEventListener("pointermove", (e) => {
  const p = localXY(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
  if (pinch && pointers.size === 2) {
    const a = Array.from(pointers.values());
    const d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
    const nz = clamp(pinch.z * d / Math.max(1, pinch.d), ZMIN, ZMAX);
    const mx = (a[0][0] + a[1][0]) / 2, my = (a[0][1] + a[1][1]) / 2;
    cam.z = nz; cam.x = pinch.mid[0] - (mx - vw / 2) / nz; cam.y = pinch.mid[1] - (my - vh / 2) / nz;
    requestRender();
    return;
  }
  if (drag) {
    const dx = p[0] - drag.sx, dy = p[1] - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; canvas.classList.add("dragging"); }
    if (drag.moved) { cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; requestRender(); }
    return;
  }
  const w = screenToWorld(p[0], p[1]);
  const pick = hitTest(w[0], w[1]);
  const pick2 = pick && pick.type === "mapArea" ? { type: "panel", id: "map" } : pick;
  if (!samePick(pick2, hover)) { hover = pick2; requestRender(); }
  const newMap = pick && pick.type === "mapArea" ? { wx: w[0], wy: w[1], sx: p[0], sy: p[1] } : null;
  if (newMap || mapHover) { mapHover = newMap; requestRender(); }
  canvas.classList.toggle("pointing", !!(pick && (pick.type === "node" || pick.type === "mapArea" || pick.type === "reduce")));
});
function endPointer(e) {
  const p = localXY(e);
  if (drag && !drag.moved && pointers.size === 1) {
    const w = screenToWorld(p[0], p[1]);
    const pick = hitTest(w[0], w[1]);
    if (pick && pick.type === "mapArea" && model) {
      const i = pickPlayer(w[0], w[1]);
      if (i >= 0) model.selected = i;
    }
    select(pick);
  }
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { drag = null; canvas.classList.remove("dragging"); }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => {
  if (hover || mapHover) { hover = null; mapHover = null; requestRender(); }
  if (embedded) activated = false;
});
canvas.addEventListener("dblclick", (e) => {
  const p = localXY(e), w = screenToWorld(p[0], p[1]);
  const pick = hitTest(w[0], w[1]);
  if (pick && pick.type === "node") {
    const n = NODE_BY_ID[pick.id];
    fitRect({ x: n.x - 360, y: n.y - 220, w: n.w + 720, h: n.h + 440 }, true);
  } else if (pick && pick.type === "panel" && GEO[pick.id]) fitRect(GEO[pick.id], true);
  else if (pick && pick.type === "mapArea") fitRect(GEO.mapArea, true);
  else zoomAt(p[0], p[1], 1.6, true);
});
canvas.addEventListener("wheel", (e) => {
  if (embedded && !activated && !e.ctrlKey && !e.metaKey) { flashHint("click the viewer first, or hold ctrl while scrolling, to zoom"); return; }
  e.preventDefault();
  const p = localXY(e);
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? vh : 1;
  zoomAt(p[0], p[1], Math.exp(-e.deltaY * unit * 0.0016), false);
}, { passive: false });
canvas.addEventListener("keydown", (e) => {
  const step = 80 / cam.z;
  let used = true;
  switch (e.key) {
    case "ArrowLeft": cam.x -= step; break;
    case "ArrowRight": cam.x += step; break;
    case "ArrowUp": cam.y -= step; break;
    case "ArrowDown": cam.y += step; break;
    case "+": case "=": zoomAt(vw / 2, vh / 2, 1.25, true); break;
    case "-": case "_": zoomAt(vw / 2, vh / 2, 0.8, true); break;
    case "0": goView("overview", true); break;
    case " ": ST.running = !ST.running; syncControls(); writeHash(); break;
    case ".": btnStep.click(); break;
    case "Escape": select(null); break;
    default: used = false;
  }
  if (used) { e.preventDefault(); requestRender(); }
});

function setHint() {
  hintEl.textContent = (embedded ? "drag: pan / ctrl+scroll: zoom" : "drag: pan / scroll: zoom") + " / click: inspect";
}
function flashHint(msg) {
  hintEl.textContent = msg;
  hintEl.classList.remove("gone");
  hintEl.classList.add("flash");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.classList.remove("flash"); setHint(); }, 2200);
}

/* ---------------- embedding API ---------------- */

window.addEventListener("message", (e) => {
  const d = e.data && e.data.libdenseViewer;
  if (!d || typeof d !== "object") return;
  const q = {};
  for (const k of ["preset", "config", "scenario", "players", "wire", "radius", "db", "hz", "budget", "cpu", "workers",
    "collision", "egress", "npc", "rings", "ring", "opts", "tps", "paused"]) if (d[k] !== undefined) q[k] = String(d[k]);
  applyParams(q);
  if (d.paused === false || d.paused === "0") ST.running = true;
  onChanged(true);
  if (d.view) goView(String(d.view), true);
});

/* ---------------- size, visibility, loop ---------------- */

let onScreen = true, raf = 0, lastNow = 0, simAcc = 0;
function layoutUi() {
  const ar = app.getBoundingClientRect();
  const b = barEl.getBoundingClientRect(), v = viewsEl.getBoundingClientRect();
  const top = Math.round(b.bottom - ar.top + 10), bottom = Math.round(ar.bottom - v.top + 10);
  const maxH = Math.max(160, Math.round(vh - top - bottom));
  inspector.style.top = top + "px"; inspector.style.maxHeight = maxH + "px";
  drawer.style.top = top + "px"; drawer.style.maxHeight = maxH + "px";
}
function resize() {
  const r = app.getBoundingClientRect();
  vw = Math.max(1, r.width); vh = Math.max(1, r.height);
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  app.classList.toggle("compact", vw < 900);
  layoutUi();
  requestRender();
}
function requestRender() { if (!raf) raf = requestAnimationFrame(loop); }
function loop(now) {
  raf = 0;
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
  lastNow = now;
  const live = ST.running && onScreen && !document.hidden && model;
  if (live) {
    simAcc += dt;
    const stepT = 1 / playRate();
    let n = 0;
    const heavy = heavySteps();
    const maxSteps = heavy || lastStepMs > 25 ? 1 : 2;
    /* heavy steps: leave (1 - duty) / duty of each step's cost as idle frames */
    const rested = !heavy || performance.now() - lastStepEnd >= lastStepMs * (1 - PLAYBACK.heavy_duty) / PLAYBACK.heavy_duty;
    while (rested && simAcc >= stepT && n < maxSteps) { doTick(); simAcc -= stepT; n++; }
    if (simAcc >= stepT) simAcc = stepT * 0.999;
    alpha = clamp(simAcc / stepT, 0, 1);
    playCol = Math.min(6, Math.floor(alpha * 7));
    if (!reducedMotion) updateParticles(dt);
  } else {
    alpha = 1; playCol = -1;
  }
  stepCamera(now);
  render();
  if (live || camAnim) raf = requestAnimationFrame(loop);
  else lastNow = 0;
}

if ("ResizeObserver" in window) {
  new ResizeObserver(resize).observe(app);
  new ResizeObserver(() => { layoutUi(); requestRender(); }).observe(barEl);
  new ResizeObserver(() => { layoutUi(); requestRender(); }).observe(viewsEl);
}
else window.addEventListener("resize", resize);
if ("IntersectionObserver" in window) {
  new IntersectionObserver((ents) => { onScreen = ents[0].isIntersecting; if (onScreen) requestRender(); }).observe(canvas);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) requestRender(); });

/* ---------------- boot ---------------- */

function boot() {
  const q = readHash();
  if (reducedMotion) ST.running = false;
  applyPresetValues("libdense");
  applyParams(q);
  syncControls();
  setHint();
  resize();
  if (vw < 1100) { drawer.hidden = true; btnSettings.setAttribute("aria-expanded", "false"); }
  else btnSettings.classList.add("on");
  layoutUi();
  requestRebuild();
  const v = q.view && VIEWS[q.view] ? q.view : (vw < 900 ? "world" : "overview");
  goView(v, false);
  requestRender();
}
const fontsReady = document.fonts && document.fonts.load ? Promise.all([
  document.fonts.load('16px "Dense Plate Serif"'),
  document.fonts.load('italic 16px "Dense Plate Serif"'),
  document.fonts.load('bold 16px "Dense Plate Serif"')
]) : Promise.resolve();
Promise.race([fontsReady, new Promise((res) => setTimeout(res, 1200))]).then(() => { measureCache.clear(); boot(); }, boot);

})();
</script>
